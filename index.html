<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- IBM Plex Sans KR: jsDelivr(@fontsource, 버전 고정). 한국에서 Cloudflare 서울(ICN) 엣지로 응답해 Google Fonts보다 빠르다. integrity는 파일이 바뀌면 로드를 막는다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-kr@5.3.0/300.css" integrity="sha384-CT64pjQBGhSmN2jAvYoUb3jwWeA4BgltEn6w8WRHpsf1nRtCaJ8zPOaJjBX6Joj7" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-kr@5.3.0/400.css" integrity="sha384-qLVaqLxeq6qZ/E40xWR0e+qVlNdUzJDclNn1c7c/YVr3Z54kjleakgc1mPj3zxsF" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-kr@5.3.0/600.css" integrity="sha384-v5pkM92zPDiVnHle/1KSWhkRf+GrjLp2VO5HbJNA9Wq0kCCIjbRDk+1EhX6FznC8" crossorigin="anonymous" />
    <!-- 코드 표시용 D2Coding: jsDelivr(npm d2coding, 버전 고정). subset은 KS X 1001 한글 2,350자만 담아 약 350kB다. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d2coding@1.3.2/d2coding-subset.css" integrity="sha384-/aGOjRgXetckwYWTzGw1zfJJPlG4ZNUhc+ntpCY45ZqFXbKWXJQyg4WlSYt5Aghw" crossorigin="anonymous" />
    <title>B-CUBE Domain</title>
    <!-- 오픈그래프: 크롤러는 스크립트를 실행하지 않으므로 여기에 적는다. 이미지 주소는 절대 경로여야 한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="B-CUBE 서브도메인 대여체계" />
    <meta property="og:title" content="B-CUBE 서브도메인 대여체계" />
    <meta property="og:description" content="직접 만든 웹사이트에 희망도메인.b-cube.kr 같은 나만의 주소를 붙일 수 있습니다. B-CUBE 소학회원에게 최대 3개까지 무료로 빌려 드립니다." />
    <meta property="og:url" content="https://domain.b-cube.kr/" />
    <meta property="og:image" content="https://domain.b-cube.kr/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="B-CUBE 서브도메인 대여체계 로고" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
